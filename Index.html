<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spotify Song Widget V2</title>
<link rel="preconnect" href="https://api.spotify.com">
<link rel="preconnect" href="https://i.scdn.co">
<link rel="preconnect" href="https://lrclib.net">
<style>
:root{--accent:#1ed760;--rgb:30 215 96;--light-rgb:30 215 96}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#030304;color:#fff}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit}
#bg{position:fixed;inset:-80px;background:#09090b center/cover no-repeat;filter:blur(55px) saturate(1.45);transform:scale(1.12);opacity:.48;transition:background-image .8s ease,opacity .5s}
#shade{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#10111666,#020204ed 72%)}
.light{position:fixed;width:42vw;height:42vw;border-radius:50%;filter:blur(75px);opacity:.48;mix-blend-mode:screen;pointer-events:none;animation:float 14s ease-in-out infinite alternate}
.l1{left:-12vw;top:-18vw;background:rgb(var(--light-rgb))}
.l2{right:-15vw;top:4vh;background:rgb(var(--light-rgb));animation-delay:-4s}
.l3{left:18vw;bottom:-24vw;background:rgb(var(--light-rgb));animation-delay:-7s}
.l4{right:18vw;bottom:-26vw;background:rgb(var(--light-rgb));animation-delay:-10s}
@keyframes float{to{transform:translate(4vw,3vh) scale(1.12)}}
main{position:relative;z-index:20;min-height:100vh;padding:34px}
.player{position:relative;width:min(1180px,94vw);margin:0 auto;min-height:720px;padding:38px 42px 34px;border-radius:34px;overflow:hidden;background:linear-gradient(135deg,#111217f2,#090a0df5);box-shadow:0 35px 110px #000c}
.player:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff03,transparent 45%);pointer-events:none}
.bgcard{position:absolute;inset:-50px;background:center/cover no-repeat;filter:blur(38px) saturate(1.45);transform:scale(1.16);opacity:.13;transition:background-image .8s ease}
.overlay{position:absolute;inset:0;background:linear-gradient(90deg,#07080be8,#090a0ddd 60%,#08090ce8)}
.header{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;margin-bottom:48px}
.brand{font-size:14px;letter-spacing:4px;font-weight:850;color:#a5a5aa}.brand span{color:#62636a}
.connection{font-size:14px;color:#92939a}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:8px}.connected .dot{background:var(--accent);box-shadow:0 0 12px rgb(var(--rgb)/.7)}
.content{position:relative;z-index:3;display:grid;grid-template-columns:48% 52%;gap:44px;align-items:start}
.cover{width:100%;aspect-ratio:1;border-radius:26px;overflow:hidden;background:#17181d;box-shadow:0 25px 70px #0009;cursor:zoom-in;position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto;transition:transform .45s ease}.cover:hover img{transform:scale(1.02)}
.coverEmpty{position:absolute;inset:0;display:grid;place-items:center;color:#555;background:linear-gradient(145deg,#202126,#131419)}.coverEmpty svg{width:58px;height:58px;fill:#4b4c52}
.info{min-width:0;padding:3px 0}
.eyebrow{font-size:13px;letter-spacing:3px;font-weight:850;color:#777980;margin-bottom:17px}
.title{font-size:clamp(38px,5vw,68px);font-weight:900;line-height:.98;letter-spacing:-2.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:25px;font-weight:700;color:#e0e0e3;margin-top:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album{font-size:17px;color:#888990;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{margin-top:34px}.bar{height:6px;border-radius:99px;background:#292a2e;cursor:pointer;position:relative}.fill{height:100%;width:0;border-radius:99px;background:var(--accent);box-shadow:0 0 18px rgb(var(--rgb)/.38);transition:width .1s linear}.times{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:#777980}
.actions{display:flex;gap:14px;align-items:center;margin-top:27px;flex-wrap:wrap}
.connect,.openSpotify{border:0;border-radius:999px;height:50px;padding:0 24px;font-weight:850;cursor:pointer}.connect{background:var(--accent);color:#050505}.openSpotify{background:#141519;color:#777;border:1px solid #25262b}.openSpotify.enabled{color:#fff;cursor:pointer}
.controls{display:flex;gap:15px;align-items:center;margin-top:27px}.btn{width:52px;height:52px;border:0;border-radius:50%;background:#15161a;color:#eee;display:grid;place-items:center;cursor:pointer}.btn.play{width:68px;height:68px;background:#fff;color:#050505}.btn svg{width:23px;height:23px;fill:currentColor}.btn.play svg{width:27px;height:27px}
.hint{font-size:15px;line-height:1.45;color:#72737a;max-width:560px;margin-top:18px}
.expand{position:absolute;right:34px;top:31px;z-index:10;width:45px;height:45px;border:0;border-radius:50%;background:#17181c;color:#ddd;display:grid;place-items:center;cursor:pointer}.expand svg{width:18px;height:18px;fill:currentColor}
.lyricsWrap{position:relative;z-index:5;margin-top:34px;height:62px;overflow:hidden;border-radius:18px;background:#17181cf0;cursor:pointer;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.lyricsWrap.open{height:410px;cursor:default}
.lyricsTop{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;color:#fff;font-size:20px;font-weight:800}
.lyricsTop .chev{font-size:23px;color:#777;transition:transform .35s}.lyricsWrap.open .chev{transform:rotate(180deg)}
.lyrics{height:calc(100% - 62px);overflow:auto;text-align:center;padding:22px 30px 80px;scroll-behavior:smooth}
.line{font-size:clamp(20px,2.4vw,29px);line-height:1.32;font-weight:760;color:#67686f;margin:0 auto 18px;max-width:820px;transition:color .3s,transform .3s,text-shadow .3s}.line.active{color:#fff;transform:scale(1.025);text-shadow:0 0 26px rgb(var(--rgb)/.45)}
.empty{color:#777;padding:25px 10px;line-height:1.5}
.modal{position:fixed;z-index:50;inset:0;background:#000e;display:none;place-items:center;padding:24px}.modal.show{display:grid}.modal img{max-width:92vw;max-height:92vh;width:auto;height:auto;display:block;border:0;border-radius:18px;box-shadow:0 30px 100px #000;touch-action:pinch-zoom;image-rendering:auto;object-fit:contain}.modal button{position:absolute;right:24px;top:24px;width:45px;height:45px;border:0;border-radius:50%;background:#222;color:#fff;font-size:27px;cursor:pointer}
@media(max-width:800px){
main{padding:14px}.player{width:96vw;min-height:0;padding:25px;border-radius:25px}.header{margin-bottom:30px}.content{grid-template-columns:1fr;gap:25px}.cover{max-width:520px;margin:auto}.info{text-align:left}.title{font-size:42px}.artist{font-size:20px}.expand{right:18px;top:18px}.lyricsWrap{margin-top:25px}.lyricsWrap.open{height:55vh}
}
@media(max-width:500px){
.player{padding:19px}.brand{font-size:11px;letter-spacing:2.5px}.connection{font-size:11px}.header{margin-bottom:22px}.cover{border-radius:20px}.eyebrow{font-size:10px;letter-spacing:2px}.title{font-size:34px;letter-spacing:-1.5px}.artist{font-size:18px;margin-top:13px}.album{font-size:13px}.progress{margin-top:23px}.actions{margin-top:18px}.connect,.openSpotify{height:46px;padding:0 17px;font-size:13px}.controls{margin-top:19px}.btn{width:45px;height:45px}.btn.play{width:58px;height:58px}.hint{font-size:13px}.lyricsTop{font-size:17px}.lyricsWrap.open{height:58vh}.lyrics{padding-left:16px;padding-right:16px}.line{font-size:20px}}

.searchBox{position:relative;margin:0 auto 22px;z-index:9999;width:min(1180px,94vw);display:block!important;visibility:visible!important}
.searchInputWrap{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:10px 14px;backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.searchIcon{width:22px;height:22px;opacity:.72;flex:0 0 auto}
.searchInput{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:18px;font-weight:600}
.searchInput::placeholder{color:rgba(255,255,255,.48)}
.searchResults{display:none;z-index:10000;position:absolute;left:0;right:0;top:62px;padding:8px;background:rgba(12,12,15,.92);border:1px solid rgba(255,255,255,.12);border-radius:18px;backdrop-filter:blur(22px);box-shadow:0 20px 50px rgba(0,0,0,.45);max-height:390px;overflow:auto}
.searchResults.show{display:block}
.searchResult{display:flex;align-items:center;gap:13px;width:100%;padding:10px;border:0;background:transparent;color:#fff;text-align:left;border-radius:13px;cursor:pointer}
.searchResult:hover,.searchResult:active{background:rgba(255,255,255,.09)}
.searchResult img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#222;flex:0 0 auto}
.searchMeta{min-width:0;flex:1}
.searchName{font-size:16px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchArtist{font-size:13px;color:rgba(255,255,255,.65);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchAlbum{font-size:12px;color:rgba(255,255,255,.42);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchPlay{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:16px;flex:0 0 auto}
.searchEmpty{padding:18px;text-align:center;color:rgba(255,255,255,.5);font-size:14px}
@media(max-width:700px){.searchInput{font-size:16px}.searchResults{max-height:330px}}


/* Buscador V2 — efectos */
.searchInputWrap{transition:transform .16s ease,box-shadow .25s ease,border-color .25s ease,background .25s ease}
.searchInputWrap:focus-within{transform:translateY(-2px) scale(1.008);border-color:rgb(var(--rgb)/.65);background:rgba(12,12,15,.72);box-shadow:0 0 0 1px rgb(var(--rgb)/.18),0 0 28px rgb(var(--rgb)/.30),0 14px 45px rgba(0,0,0,.35)}
.searchInput{transition:transform .12s ease}
.searchInput.key-pop{animation:keyPop .18s cubic-bezier(.2,.8,.2,1)}
.searchInputWrap.key-glow{animation:keyGlow .28s ease-out}
@keyframes keyPop{0%{transform:scale(.985)}55%{transform:scale(1.018)}100%{transform:scale(1)}}
@keyframes keyGlow{0%{box-shadow:0 0 0 0 rgb(var(--rgb)/.65),0 0 0 rgb(var(--rgb)/0)}45%{box-shadow:0 0 0 4px rgb(var(--rgb)/.14),0 0 42px rgb(var(--rgb)/.38)}100%{box-shadow:0 0 0 0 rgb(var(--rgb)/0),0 0 18px rgb(var(--rgb)/.18)}}
.searchResult{transform:translateY(8px);opacity:0;animation:resultIn .32s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes resultIn{to{transform:translateY(0);opacity:1}}
.searchResult:hover{transform:translateX(4px)}
.searchResult .searchPlay{transition:transform .2s ease,background .2s ease}
.searchResult:hover .searchPlay{transform:scale(1.12);background:rgb(var(--rgb)/.28)}
.searchEmpty.searchLoading{animation:loadingPulse 1s ease-in-out infinite alternate}
@keyframes loadingPulse{from{opacity:.45}to{opacity:1}}


/* BUSCADOR SIEMPRE VISIBLE */
#searchBox{display:block!important;visibility:visible!important;opacity:1!important;position:relative!important;z-index:9999!important}
#searchBox .searchInputWrap{position:relative;z-index:10000}
#searchBox .searchResults{z-index:10001}

/* V2 visual upgrade */
:root{
  --accent:#1ed760;
  --rgb:30 215 96;
  --light-rgb:30 215 96;
  --accent-soft:30 215 96;
  --accent-strong:30 215 96;
}

/* Album-colored controls */
.connect{
  background:rgb(var(--rgb));
  color:#050505;
  box-shadow:0 0 24px rgb(var(--rgb)/.18);
  transition:transform .18s ease,box-shadow .25s ease,filter .2s ease;
}
.connect:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 0 32px rgb(var(--rgb)/.32)}
.openSpotify{
  border-color:rgb(var(--rgb)/.28);
  transition:transform .18s ease,border-color .25s ease,color .25s ease,background .25s ease;
}
.openSpotify.enabled{color:rgb(var(--rgb));border-color:rgb(var(--rgb)/.45);background:rgb(var(--rgb)/.07)}
.openSpotify.enabled:hover{transform:translateY(-2px);background:rgb(var(--rgb)/.14)}

.btn{
  border:1px solid rgb(var(--rgb)/.12);
  background:rgb(var(--rgb)/.08);
  color:rgb(var(--rgb));
  box-shadow:0 8px 28px rgba(0,0,0,.22);
  transition:transform .16s ease,background .2s ease,box-shadow .25s ease,color .2s ease;
}
.btn:hover{transform:translateY(-3px) scale(1.04);background:rgb(var(--rgb)/.18);box-shadow:0 0 28px rgb(var(--rgb)/.25)}
.btn.play{
  background:rgb(var(--rgb));
  color:#050505;
  box-shadow:0 0 34px rgb(var(--rgb)/.34),0 12px 32px rgba(0,0,0,.25);
}
.btn.play:hover{background:rgb(var(--rgb));filter:brightness(1.08);box-shadow:0 0 46px rgb(var(--rgb)/.48),0 15px 35px rgba(0,0,0,.3)}

.bar{
  background:rgb(var(--rgb)/.18);
  box-shadow:inset 0 0 0 1px rgb(var(--rgb)/.08);
}
.fill{
  background:rgb(var(--rgb));
  box-shadow:0 0 18px rgb(var(--rgb)/.55);
}
.times{color:rgb(var(--rgb)/.68)}
.line.active{
  color:#fff;
  text-shadow:0 0 24px rgb(var(--rgb)/.55);
}
.line.active::before{
  content:"";
  display:inline-block;
  width:7px;
  height:7px;
  margin:0 10px 5px 0;
  border-radius:50%;
  background:rgb(var(--rgb));
  box-shadow:0 0 14px rgb(var(--rgb)/.9);
}
.lyricsTop{
  border-bottom:1px solid rgb(var(--rgb)/.12);
}
.lyricsTop .chev{color:rgb(var(--rgb)/.65)}
.expand{
  border:1px solid rgb(var(--rgb)/.15);
  color:rgb(var(--rgb));
  box-shadow:0 0 20px rgb(var(--rgb)/.08);
}

/* Faster/smoother visual rendering */
.cover img,.modal img{will-change:transform}
.cover{contain:layout paint}
.searchResult img{content-visibility:auto}

/* Music particles */
#musicDots{
  position:fixed;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
}
.musicDot{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:rgb(var(--rgb));
  box-shadow:0 0 8px rgb(var(--rgb)/.8),0 0 22px rgb(var(--rgb)/.42);
  opacity:.08;
  transform:translate3d(0,0,0) scale(.65);
  will-change:transform,opacity;
  transition:background .7s ease,box-shadow .7s ease;
}
.musicDot.on{
  opacity:.9;
}

</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div><div class="light l1"></div><div class="light l2"></div><div class="light l3"></div><div class="light l4"></div><div id="musicDots" aria-hidden="true"></div>

<main>
<section class="searchBox" id="searchBox">
  <div class="searchInputWrap" id="searchInputWrap">
    <svg class="searchIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
    <input class="searchInput" id="searchInput" type="search" autocomplete="off" placeholder="Buscar canción, artista o álbum…" aria-label="Buscar en Spotify">
  </div>
  <div class="searchResults" id="searchResults"></div>
</section>
<section class="player" id="player">
  <div class="bgcard" id="cardBg"></div><div class="overlay"></div>

  <div class="header">
    <div class="brand">NOW PLAYING <span>•</span> SPOTIFY</div>
    <div class="connection" id="connection"><span class="dot"></span>Desconectado</div>
  </div>

  <button class="expand" id="expand" aria-label="Expandir reproductor"><svg viewBox="0 0 24 24"><path d="M8 4H4v4h2V6h2V4zm8 0v2h2v2h2V4h-4zm2 12v2h-2v2h4v-4h-2zM4 16v4h4v-2H6v-2H4z"/></svg></button>

  <div class="content">
    <div class="cover" id="cover">
      <div class="coverEmpty" id="coverEmpty"><svg viewBox="0 0 24 24"><path d="M12 3v11.05A4 4 0 1 0 14 17V7h5V3h-7z"/></svg></div>
      <img id="coverImg" alt="" aria-hidden="true" decoding="async" fetchpriority="high" style="display:none">
    </div>

    <div class="info">
      <div class="eyebrow">CURRENT TRACK</div>
      <div class="title" id="title">Conecta Spotify</div>
      <div class="artist" id="artist">Tu canción aparecerá aquí</div>
      <div class="album" id="album">Conecta tu cuenta para empezar</div>

      <div class="progress">
        <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
        <div class="times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
      </div>

      <div class="actions">
        <button class="connect" id="connect">Conectar Spotify</button>
        <button class="openSpotify" id="openSpotify" disabled>↗ Abrir en Spotify</button>
      </div>

      <div class="hint" id="hint">Conecta Spotify para detectar automáticamente lo que estás escuchando.</div>

      <div class="controls">
        <button class="btn" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6V5zm3 7 9-7v14l-9-7z"/></svg></button>
        <button class="btn play" id="play" aria-label="Reproducir"><svg viewBox="0 0 24 24"><path d="M8 5.5v13L19 12 8 5.5z"/></svg></button>
        <button class="btn" id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2V5zm-11 0 9 7-9 7V5z"/></svg></button>
      </div>
    </div>
  </div>

  <div class="lyricsWrap" id="lyricsWrap">
    <div class="lyricsTop"><span>♫ Letra</span><span class="chev">⌄</span></div>
    <div class="lyrics" id="lyrics"><div class="empty">Conecta Spotify para cargar la letra.</div></div>
  </div>
</section>
</main>

<div class="modal" id="modal"><button id="close" aria-label="Cerrar">×</button><img id="modalImg" alt="Portada ampliada" decoding="async"></div>

<script>
const CLIENT_ID="7cd5bc8f5dc048a388537fb6d19a74b9";
const REDIRECT_URI="https://neiraprox.github.io/spotify-song-widget/";
const SCOPES="user-read-currently-playing user-read-playback-state user-modify-playback-state";
const $=id=>document.getElementById(id);
let token=null,track=null,progress=0,duration=0,isPlaying=false,lastTick=0,lyrics=[],active=-1,searchTimer=null,searchRequest=0;

function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function pkce(){const verifier=b64(crypto.getRandomValues(new Uint8Array(32)));const hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier));localStorage.setItem("spotify_verifier",verifier);return b64(hash)}
async function login(){const challenge=await pkce();const u=new URL("https://accounts.spotify.com/authorize");u.searchParams.set("client_id",CLIENT_ID);u.searchParams.set("response_type","code");u.searchParams.set("redirect_uri",REDIRECT_URI);u.searchParams.set("scope",SCOPES);u.searchParams.set("code_challenge_method","S256");u.searchParams.set("code_challenge",challenge);location.href=u}
async function exchange(){const code=new URLSearchParams(location.search).get("code");if(!code)return;const verifier=localStorage.getItem("spotify_verifier");const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:"authorization_code",code,redirect_uri:REDIRECT_URI,code_verifier:verifier})});if(!r.ok)throw Error("No se pudo iniciar sesión");const d=await r.json();token=d.access_token;localStorage.setItem("spotify_token",token);history.replaceState({},document.title,REDIRECT_URI);start()}
function setCover(url){
  if(!url){
    $("coverEmpty").style.display="grid";
    $("coverImg").style.display="none";
    return;
  }
  const img=$("coverImg");
  const modal=$("modalImg");
  img.src=url;
  modal.src=url;
  const show=()=>{
    img.style.display="block";
    $("coverEmpty").style.display="none";
  };
  if(img.decode) img.decode().catch(()=>{}).finally(show); else show();
  $("bg").style.backgroundImage=`url("${url}")`;
  $("cardBg").style.backgroundImage=`url("${url}")`;
}
function rgbTheme(url){
  if(!url)return;
  const img=new Image();
  img.crossOrigin="anonymous";
  img.onload=()=>{
    try{
      const c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true});
      c.width=48;c.height=48;x.drawImage(img,0,0,48,48);
      const d=x.getImageData(0,0,48,48).data;
      let best=[30,215,96],second=[80,100,130],scoreBest=-1,scoreSecond=-1;
      for(let i=0;i<d.length;i+=4){
        const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);
        const sat=mx?((mx-mn)/mx):0,lum=.2126*r+.7152*g+.0722*b;
        if(lum<18 || lum>248) continue;
        const score=lum*(.38+sat*1.55);
        if(score>scoreBest){scoreSecond=scoreBest;second=best;scoreBest=score;best=[r,g,b]}
        else if(score>scoreSecond){scoreSecond=score;second=[r,g,b]}
      }
      document.documentElement.style.setProperty("--accent",`rgb(${best.join(",")})`);
      document.documentElement.style.setProperty("--rgb",best.join(" "));
      document.documentElement.style.setProperty("--light-rgb",best.join(" "));
      document.documentElement.style.setProperty("--accent-soft",second.join(" "));
      $("player").style.setProperty("--accent",`rgb(${best.join(",")})`);
    }catch(e){}
  };
  img.src=url;
}
async function api(path,opt={}){const r=await fetch("https://api.spotify.com/v1"+path,{...opt,headers:{Authorization:"Bearer "+token,...(opt.headers||{})}});if(r.status===401){localStorage.removeItem("spotify_token");token=null;throw Error("Spotify expiró")}if(r.status===204)return null;if(!r.ok)throw Error("Spotify API "+r.status);return r.json()}
async function getTrack(){const d=await api("/me/player");$("connection").innerHTML='<span class="dot"></span>'+(d?"Conectado":"Sin reproducción");$("connection").classList.toggle("connected",!!d);if(!d||!d.item){isPlaying=false;$("title").textContent="Conecta Spotify";$("artist").textContent="Tu canción aparecerá aquí";$("album").textContent="Conecta tu cuenta para empezar";$("openSpotify").disabled=true;$("hint").textContent="Conecta Spotify para detectar automáticamente lo que estás escuchando.";return}const t=d.item,changed=!track||track.id!==t.id;track=t;duration=t.duration_ms||0;progress=d.progress_ms||0;isPlaying=!!d.is_playing;lastTick=performance.now();$("title").textContent=t.name;$("artist").textContent=t.artists.map(a=>a.name).join(", ");$("album").textContent=t.album?.name||"";$("openSpotify").disabled=false;$("openSpotify").classList.add("enabled");$("openSpotify").dataset.url=t.external_urls?.spotify||"";$("hint").textContent=isPlaying?"Reproduciendo ahora desde Spotify":"La reproducción está en pausa";setCover(t.album?.images?.slice().sort((a,b)=>(b.width||0)*(b.height||0)-(a.width||0)*(a.height||0))[0]?.url);rgbTheme(t.album?.images?.slice().sort((a,b)=>(b.width||0)*(b.height||0)-(a.width||0)*(a.height||0))[0]?.url);updatePlayIcon();if(changed)loadLyrics(t)}
function updatePlayIcon(){$("play").innerHTML=isPlaying?'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5.5v13L19 12 8 5.5z"/></svg>'}
async function searchSpotify(q){
  q=q.trim();
  if(!q){
    $('searchResults').classList.remove('show');
    $('searchResults').innerHTML='';
    return;
  }
  if(!token){
    $('searchResults').innerHTML='<div class="searchEmpty">Inicia sesión con Spotify para buscar canciones.</div>';
    $('searchResults').classList.add('show');
    return;
  }
  const request=++searchRequest;
  $('searchResults').innerHTML='<div class="searchEmpty searchLoading">⌕ Buscando en Spotify…</div>';
  $('searchResults').classList.add('show');
  try{
    const d=await api('/search?type=track&limit=8&q='+encodeURIComponent(q));
    if(request!==searchRequest)return;
    const items=d?.tracks?.items||[];
    if(!items.length){$('searchResults').innerHTML='<div class="searchEmpty">No encontré canciones con esa búsqueda.</div>';return}
    $('searchResults').innerHTML=items.map(t=>{
      const img=t.album?.images?.slice().sort((a,b)=>(b.width||0)*(b.height||0)-(a.width||0)*(a.height||0))[0]?.url||'';
      const artists=t.artists?.map(a=>a.name).join(', ')||'';
      return `<button class="searchResult" data-uri="${escapeAttr(t.uri)}" data-id="${escapeAttr(t.id)}">
        <img src="${escapeAttr(img)}" alt="" loading="eager" decoding="async">
        <span class="searchMeta"><span class="searchName">${escapeHtml(t.name)}</span><span class="searchArtist">${escapeHtml(artists)}</span><span class="searchAlbum">${escapeHtml(t.album?.name||'')}</span></span>
        <span class="searchPlay">▶</span>
      </button>`;
    }).join('');
  }catch(e){
    if(request!==searchRequest)return;
    $('searchResults').innerHTML='<div class="searchEmpty">No se pudo buscar. Revisa la conexión con Spotify.</div>';
  }
}
async function playSearchResult(uri){
  if(!token)return login();
  try{
    $('hint').textContent='Cambiando canción…';
    $('searchResults').classList.remove('show');
    await api('/me/player/play',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({uris:[uri],position_ms:0})});
    // Keep the search independent from the player: Spotify changes immediately,
    // then we refresh the player a few times so the new track appears reliably.
    let tries=0;
    const refresh=async()=>{
      tries++;
      try{
        await getTrack();
        if(tries<4 && track?.uri!==uri)setTimeout(refresh,350);
      }catch(e){if(tries<4)setTimeout(refresh,350)}
    };
    setTimeout(refresh,250);
  }catch(e){
    $("hint").textContent='No se pudo cambiar la canción. Abre Spotify y asegúrate de tener un dispositivo activo.';
  }
}
function escapeAttr(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function parseLRC(s){return s.split(/\r?\n/).flatMap(row=>{const times=[...row.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)],text=row.replace(/\[[^\]]+\]/g,"").trim();return times.map(m=>({time:(+m[1]*60+ +m[2])*1000,text}))}).filter(x=>x.text).sort((a,b)=>a.time-b.time)}
async function loadLyrics(t){$("lyrics").innerHTML='<div class="empty">Buscando letra…</div>';lyrics=[];active=-1;const p=new URLSearchParams({track_name:t.name,artist_name:t.artists?.[0]?.name||"",album_name:t.album?.name||"",duration:String(Math.round(t.duration_ms/1000))});try{const r=await fetch("https://lrclib.net/api/get?"+p.toString());if(!r.ok)throw Error();const d=await r.json();if(d.syncedLyrics)lyrics=parseLRC(d.syncedLyrics);if(lyrics.length){$("lyrics").innerHTML=lyrics.map((l,i)=>`<div class="line" data-i="${i}">${escapeHtml(l.text)}</div>`).join("")}else if(d.plainLyrics){$("lyrics").innerHTML=d.plainLyrics.split(/\r?\n/).map(x=>`<div class="line">${escapeHtml(x||" ")}</div>`).join("")}else throw Error()}catch(e){$("lyrics").innerHTML='<div class="empty">No encontré una letra para esta canción.</div>'}}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

/* Ambient particles: they pulse and travel using the current playback clock. */
const musicDots=[];
function initMusicDots(){
  const box=$("musicDots");
  if(!box || musicDots.length) return;
  for(let i=0;i<26;i++){
    const el=document.createElement("span");
    el.className="musicDot";
    el.style.left=(4+Math.random()*92)+"vw";
    el.style.top=(8+Math.random()*84)+"vh";
    el.dataset.phase=(Math.random()*Math.PI*2).toFixed(3);
    el.dataset.speed=(.55+Math.random()*1.15).toFixed(3);
    el.dataset.drift=(10+Math.random()*42).toFixed(1);
    el.dataset.size=(.55+Math.random()*1.25).toFixed(2);
    const s=parseFloat(el.dataset.size);
    el.style.width=(4*s)+"px";
    el.style.height=(4*s)+"px";
    box.appendChild(el);
    musicDots.push(el);
  }
}
function animateMusicDots(now){
  initMusicDots();
  const t=now/1000;
  // Spotify's player API gives exact playback position, but not a beat clock.
  // We use a musical pulse anchored to the real playback position so the
  // particles stay synchronized with the song timeline.
  const bpm=112;
  const beat=(progress/1000)*(bpm/60);
  musicDots.forEach((el,i)=>{
    const phase=parseFloat(el.dataset.phase);
    const speed=parseFloat(el.dataset.speed);
    const drift=parseFloat(el.dataset.drift);
    const wave=Math.sin((beat+phase)*Math.PI*2);
    const travel=Math.sin(t*speed*.45+phase)*drift;
    const lift=Math.cos(t*speed*.34+phase)*drift*.65;
    const scale=0.65 + Math.max(0,wave)*1.55;
    el.style.transform=`translate3d(${travel}px,${lift}px,0) scale(${scale})`;
    el.style.opacity=isPlaying ? String(.14 + Math.max(0,wave)*.72) : ".07";
    el.classList.toggle("on",isPlaying && wave>.15);
  });
}

function tick(if(isPlaying&&duration)progress=Math.min(duration,progress+(performance.now()-lastTick));lastTick=performance.now();$("fill").style.width=duration?(progress/duration*100)+"%":"0%";$("currentTime").textContent=fmt(progress);$("duration").textContent=fmt(duration);if(lyrics.length){let i=-1;for(let n=0;n<lyrics.length;n++)if(lyrics[n].time<=progress)i=n;if(i!==active){active=i;document.querySelectorAll(".line").forEach((el,n)=>el.classList.toggle("active",n===i));const el=document.querySelector(`.line[data-i="${i}"]`);if(el&&$("lyricsWrap").classList.contains("open"))$("lyrics").scrollTo({top:Math.max(0,el.offsetTop-$("lyrics").clientHeight*.38),behavior:"smooth"})}}requestAnimationFrame(tick)}
function fmt(ms){if(!ms||ms<0)return"0:00";const sec=Math.floor(ms/1000),m=Math.floor(sec/60),s=String(sec%60).padStart(2,"0");return m+":"+s}
async function control(path,method="PUT"){if(!token)return login();try{await api(path,{method});setTimeout(getTrack,250)}catch(e){$("hint").textContent=e.message}}

const searchInput=$('searchInput');
searchInput.addEventListener('input',()=>{
  clearTimeout(searchTimer);
  searchInput.classList.remove('key-pop');
  $('searchInputWrap')?.classList.remove('key-glow');
  void searchInput.offsetWidth;
  searchInput.classList.add('key-pop');
  $('searchInputWrap')?.classList.add('key-glow');
  setTimeout(()=>searchInput.classList.remove('key-pop'),190);
  setTimeout(()=>$('searchInputWrap')?.classList.remove('key-glow'),300);
  const q=searchInput.value;
  searchTimer=setTimeout(()=>searchSpotify(q),170);
});
searchInput.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    searchInput.value='';
    $('searchResults').classList.remove('show');
    searchInput.blur();
  }
  if(e.key==='Enter' && searchInput.value.trim()) searchSpotify(searchInput.value);
});
searchInput.addEventListener('focus',()=>{if(searchInput.value.trim())searchSpotify(searchInput.value)});
document.addEventListener('keydown',e=>{
  if(e.key==='/' && document.activeElement!==searchInput){
    e.preventDefault(); searchInput.focus(); searchInput.select();
  }
  if(e.key==='Escape'){
    $('searchResults').classList.remove('show');
    searchInput.blur();
  }
});
$('searchResults').addEventListener('click',e=>{
  const b=e.target.closest('.searchResult');
  if(b)playSearchResult(b.dataset.uri);
});
searchInput.addEventListener('focus',()=>{
  $('searchBox').style.display='block';
  $('searchBox').hidden=false;
  if(searchInput.value.trim())searchSpotify(searchInput.value);
});
document.addEventListener('click',e=>{
  if(!$('searchBox').contains(e.target))$('searchResults').classList.remove('show');
  $('searchBox').style.display='block';
  $('searchBox').hidden=false;
});

$("connect").onclick=login;$("prev").onclick=()=>control("/me/player/previous","POST");$("next").onclick=()=>control("/me/player/next","POST");$("play").onclick=()=>control(isPlaying?"/me/player/pause":"/me/player/play");
$("openSpotify").onclick=()=>{const u=$("openSpotify").dataset.url;if(u)window.open(u,"_blank","noopener")};
$("bar").onclick=e=>{if(!duration||!token)return;const r=$("bar").getBoundingClientRect();const pos=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));control("/me/player/seek?position_ms="+Math.round(pos*duration),"PUT")};
$("lyricsWrap").onclick=e=>{if(e.target.closest(".lyrics")&&$("lyricsWrap").classList.contains("open"))return;$("lyricsWrap").classList.toggle("open")};
$("expand").onclick=()=>{$("player").classList.toggle("expanded")};
$("cover").onclick=()=>{if(track)$("modal").classList.add("show")};$("close").onclick=()=>$("modal").classList.remove("show");$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("show")};
async function start(){
  $('searchBox').style.display='block';
  $('searchBox').hidden=false;
  try{
    await getTrack();
  }catch(e){
    $('connection').innerHTML='<span class="dot"></span>Error';
  }
  setInterval(()=>{
    $('searchBox').style.display='block';
    $('searchBox').hidden=false;
    getTrack().catch(()=>{});
  },2000);
} 
(async()=>{try{token=localStorage.getItem("spotify_token");await exchange();if(token)await start();requestAnimationFrame(tick)}catch(e){$("connection").innerHTML='<span class="dot"></span>Desconectado';requestAnimationFrame(tick)}})();
</script>
